media:
  - name: site_images
    label: Website images
    input: assets
    output: /assets
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]
    rename: safe

components:
  moduleHeader:
    type: object
    fields:
      - {name: visible, label: Show this module, type: boolean}
      - {name: sectionLabelEn, label: Module label (English), type: string}
      - {name: sectionLabelZh, label: Module label (Chinese), type: string}
      - {name: titleEn, label: Module title (English), type: string}
      - {name: titleZh, label: Module title (Chinese), type: string}
  sectionIntro:
    type: object
    fields:
      - name: introEn
        label: Introduction (English)
        type: rich-text
        options: {format: markdown, switcher: false, media: site_images, path: content}
      - name: introZh
        label: Introduction (Chinese)
        type: rich-text
        options: {format: markdown, switcher: false, media: site_images, path: content}

content:
  - name: website
    label: Website editor
    type: group
    items:
      - name: profile
        label: Profile and homepage
        type: file
        path: data/site.json
        format: json
        fields:
          - {name: firstName, label: First name, type: string}
          - {name: lastName, label: Last name, type: string}
          - {name: pageTitle, label: Browser tab title, type: string}
          - {name: pageDescription, label: Search description, type: text}
          - name: avatar
            label: Portrait image
            type: image
            options: {media: site_images, path: profiles, extensions: [jpg, jpeg, png, webp]}
          - {name: avatarAlt, label: Portrait description, type: string}
          - {name: monogram, label: Initials shown without a portrait, type: string}
          - {name: email, label: Email address, type: string}
          - {name: phone, label: Phone number, type: string}
          - {name: heroKickerEn, label: Short profile label (English), type: string}
          - {name: heroKickerZh, label: Short profile label (Chinese), type: string}
          - {name: languageSwitchEn, label: Language switch text (English page), type: string}
          - {name: languageSwitchZh, label: Language switch text (Chinese page), type: string}
          - {name: showHeader, label: Show navigation bar, type: boolean}
          - {name: showHero, label: Show profile image and contacts, type: boolean}
          - {name: showFooter, label: Show footer, type: boolean}
          - name: footerTextEn
            label: Footer text (English)
            type: rich-text
            options: {format: markdown, switcher: false, media: site_images, path: content}
          - name: footerTextZh
            label: Footer text (Chinese)
            type: rich-text
            options: {format: markdown, switcher: false, media: site_images, path: content}
      - name: navigation
        label: Main page navigation (names and order)
        type: file
        path: data/navigation.json
        format: json
        fields:
          - name: items
            label: Main pages
            type: object
            list:
              collapsible: {collapsed: true, summary: "{fields.labelEn} / {fields.labelZh}"}
            fields:
              - name: key
                label: Page destination
                type: select
                options: {values: [profile, education, research, publication, honor, life]}
              - {name: labelEn, label: Navigation name (English), type: string}
              - {name: labelZh, label: Navigation name (Chinese), type: string}
      - name: appearance
        label: Appearance
        type: file
        path: data/style.json
        format: json
        fields:
          - name: general
            label: "General / 通用"
            type: object
            fields:
              - name: typography
                label: "Font sizes / 文字字号"
                type: object
                fields:
                  - name: bodySize
                    label: "Base body font size (px) / 正文基础字号 (px)"
                    type: number
                  - name: headingSize
                    label: "Module heading size (px) / 模块标题字号 (px)"
                    type: number
                  - name: itemSize
                    label: "Entry title size (px) / 条目标题字号 (px)"
                    type: number
                  - name: metadataSize
                    label: "Metadata font size (px) / 作者、期刊、日期与副标题字号 (px)"
                    type: number
              - name: colors
                label: "Colors / 全站颜色"
                type: object
                fields:
                  - name: border
                    label: "Border and divider color (HEX) / 边框与分隔线（HEX，如 #26323d）"
                    type: string
                  - name: background
                    label: "Page background color (HEX) / 页面背景（HEX，如 #26323d）"
                    type: string
                  - name: soft
                    label: "Soft background color (HEX) / 浅色背景（HEX，如 #26323d）"
                    type: string
              - name: layout
                label: "Layout and spacing / 页面布局与间距"
                type: object
                fields:
                  - name: width
                    label: "Maximum content width (px) / 内容最大宽度 (px)"
                    type: number
                  - name: gutter
                    label: "Page side padding (px) / 页面左右留白 (px)"
                    type: number
                  - name: sectionTop
                    label: "Module top spacing (px) / 模块顶部间距 (px)"
                    type: number
                  - name: sectionBottom
                    label: "Module bottom spacing (px) / 模块底部间距 (px)"
                    type: number
                  - name: columnGap
                    label: "Column gap (px) / 列间距 (px)"
                    type: number
                  - name: borderWidth
                    label: "Divider width (px) / 分隔线宽度 (px)"
                    type: number
                  - name: radius
                    label: "Default corner radius (px) / 通用圆角 (px)"
                    type: number
                  - name: headingGap
                    label: "Heading to content spacing (px) / 标题与内容间距 (px)"
                    type: number
              - name: navigation
                label: "Navigation and language button / 导航与语言按钮"
                type: object
                fields:
                  - name: fontSize
                    label: "Navigation font size (px) / 导航字号 (px)"
                    type: number
                  - name: height
                    label: "Minimum navigation height (px) / 导航栏最小高度 (px)"
                    type: number
                  - name: gap
                    label: "Navigation item spacing (px) / 导航项目间距 (px)"
                    type: number
                  - name: logoSize
                    label: "Header portrait logo size (px) / 左上角头像 Logo 尺寸 (px)"
                    type: number
                  - name: buttonSize
                    label: "Language button font size (px) / 语言按钮字号 (px)"
                    type: number
                  - name: buttonRadius
                    label: "Language button radius (px) / 语言按钮圆角 (px)"
                    type: number
              - name: cards
                label: "Cards / 通用卡片"
                type: object
                fields:
                  - name: columns
                    label: "Card columns / 卡片列数"
                    type: number
                  - name: padding
                    label: "Card padding (px) / 卡片内边距 (px)"
                    type: number
                  - name: gap
                    label: "Card gap (px) / 卡片间距 (px)"
                    type: number
                  - name: imageHeight
                    label: "Maximum card image height (px) / 卡片图片最大高度 (px)"
                    type: number
              - name: footer
                label: "Footer / 页脚"
                type: object
                fields:
                  - name: fontSize
                    label: "Footer font size (px) / 页脚字号 (px)"
                    type: number
                  - name: padding
                    label: "Footer vertical padding (px) / 页脚上下内边距 (px)"
                    type: number
              - name: mobile
                label: "Mobile styles / 手机端样式"
                type: object
                fields:
                  - name: gutter
                    label: "Page side padding (px) / 页面左右留白 (px)"
                    type: number
                  - name: headingSize
                    label: "Module heading size (px) / 模块标题字号 (px)"
                    type: number
                  - name: navigationSize
                    label: "Navigation font size (px) / 导航字号 (px)"
                    type: number
                  - name: avatarSize
                    label: "Portrait size (px) / 头像尺寸 (px)"
                    type: number
                  - name: aboutImageSize
                    label: "About Me image size (px) / About Me 图片尺寸 (px)"
                    type: number
                  - name: educationLogoSize
                    label: "School logo size (px) / 学校 Logo 尺寸 (px)"
                    type: number
                  - name: cardColumns
                    label: "Card columns / 卡片列数"
                    type: number
                  - name: linkColumns
                    label: "Homepage link columns / 主页链接列数"
                    type: number
                  - name: bodySize
                    label: "Mobile body size (px) / 手机端正文字号 (px)"
                    type: number
                  - name: itemSize
                    label: "Mobile entry title size (px) / 手机端条目标题字号 (px)"
                    type: number
                  - name: metadataSize
                    label: "Mobile metadata size (px) / 手机端信息文字字号 (px)"
                    type: number
              - name: text
                label: "Text modules / 文字模块"
                type: object
                fields:
                  - name: otherImageHeight
                    label: "Other text module image maximum height (px) / 其他文字模块图片最大高度 (px)"
                    type: number
          - name: mainPages
            label: "Main pages / 主页面"
            type: object
            fields:
              - name: profile
                label: "Profile / 个人介绍"
                type: object
                fields:
                  - name: spacing
                    label: "Module spacing (optional) / 模块间距（留空继承通用）"
                    type: object
                    fields:
                      - name: top
                        label: "Top spacing (px) / 顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Bottom spacing (px) / 底部间距 (px)"
                        type: number
                  - name: portrait
                    label: "Portrait and contacts / 头像与联系方式"
                    type: object
                    fields:
                      - name: avatarSize
                        label: "Portrait size (px) / 头像尺寸 (px)"
                        type: number
                      - name: avatarRadius
                        label: "Portrait roundness (%) / 头像圆角 (%)"
                        type: number
                      - name: imageFit
                        label: "Portrait image fit / 头像裁剪"
                        type: select
                        options: {values: ["cover","contain"]}
                      - name: top
                        label: "Portrait area top spacing (px) / 头像区域顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Portrait area bottom spacing (px) / 头像区域底部间距 (px)"
                        type: number
                      - name: contactSize
                        label: "Email and phone font size (px) / 邮箱与电话字号 (px)"
                        type: number
                      - name: iconSize
                        label: "Contact icon size (px) / 联系方式图标尺寸 (px)"
                        type: number
                      - name: iconGap
                        label: "Icon to text spacing (px) / 图标与文字间距 (px)"
                        type: number
                      - name: contactTop
                        label: "Portrait to contacts spacing (px) / 头像与联系方式间距 (px)"
                        type: number
                      - name: contactGap
                        label: "Contact row spacing (px) / 多条联系方式间距 (px)"
                        type: number
                  - name: about
                    label: "About Me / 个人介绍图片"
                    type: object
                    fields:
                      - name: imageSize
                        label: "About Me image size (px) / About Me 图片尺寸 (px)"
                        type: number
                      - name: imageRadius
                        label: "About Me image roundness (%) / About Me 图片圆角 (%)"
                        type: number
                      - name: imageGap
                        label: "About Me image to text spacing (px) / About Me 图片与文字间距 (px)"
                        type: number
                  - name: news
                    label: "Latest News / 最新动态"
                    type: object
                    fields:
                      - name: entryGap
                        label: "News entry spacing (px) / 新闻条目间距 (px)"
                        type: number
                      - name: dateGap
                        label: "Date to content spacing (px) / 日期与内容间距 (px)"
                        type: number
                      - name: bulletSize
                        label: "Date bullet size (px) / 日期前方块尺寸 (px)"
                        type: number
                      - name: imageWidth
                        label: "Maximum image width (px) / 图片最大宽度 (px)"
                        type: number
                      - name: imageHeight
                        label: "Maximum image height (px) / 图片最大高度 (px)"
                        type: number
                      - name: imageRadius
                        label: "News image radius (px) / 新闻图片圆角 (px)"
                        type: number
                  - name: links
                    label: "Personal Homepages / 个人主页链接"
                    type: object
                    fields:
                      - name: columns
                        label: "Link card columns / 链接卡片列数"
                        type: number
                      - name: iconSize
                        label: "Icon area size (px) / 图标区域尺寸 (px)"
                        type: number
                      - name: iconGlyphSize
                        label: "Icon glyph size (px) / 图标本体尺寸 (px)"
                        type: number
                      - name: padding
                        label: "Link card padding (px) / 链接卡片内边距 (px)"
                        type: number
                      - name: gap
                        label: "Link card gap (px) / 链接卡片间距 (px)"
                        type: number
              - name: education
                label: "Education / 教育经历"
                type: object
                fields:
                  - name: spacing
                    label: "Module spacing (optional) / 模块间距（留空继承通用）"
                    type: object
                    fields:
                      - name: top
                        label: "Top spacing (px) / 顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Bottom spacing (px) / 底部间距 (px)"
                        type: number
                  - name: schools
                    label: "School layout / 学校布局"
                    type: object
                    fields:
                      - name: logoSize
                        label: "School logo size (px) / 学校 Logo 区域尺寸 (px)"
                        type: number
                      - name: logoFit
                        label: "Logo image fit / Logo 图片适应方式"
                        type: select
                        options: {values: ["contain","cover"]}
                      - name: logoRadius
                        label: "Logo corner radius (px) / Logo 圆角 (px)"
                        type: number
                      - name: columnGap
                        label: "Logo to text spacing (px) / Logo 与文字间距 (px)"
                        type: number
                      - name: textWidth
                        label: "Maximum text width (px) / 文字区域最大宽度 (px)"
                        type: number
                      - name: fieldGap
                        label: "Field row spacing (px) / 每行内容间距 (px)"
                        type: number
                      - name: entryPadding
                        label: "School entry vertical padding (px) / 每所学校上下间距 (px)"
                        type: number
                      - name: bulletSize
                        label: "Field bullet size (px) / 分类圆点尺寸 (px)"
                        type: number
                      - name: bulletGap
                        label: "Bullet to content spacing (px) / 圆点与内容间距 (px)"
                        type: number
              - name: research
                label: "Research / 研究"
                type: object
                fields:
                  - name: spacing
                    label: "Module spacing (optional) / 模块间距（留空继承通用）"
                    type: object
                    fields:
                      - name: top
                        label: "Top spacing (px) / 顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Bottom spacing (px) / 底部间距 (px)"
                        type: number
              - name: publication
                label: "Publication / 论文"
                type: object
                fields:
                  - name: spacing
                    label: "Module spacing (optional) / 模块间距（留空继承通用）"
                    type: object
                    fields:
                      - name: top
                        label: "Top spacing (px) / 顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Bottom spacing (px) / 底部间距 (px)"
                        type: number
                  - name: entries
                    label: "Publication layout / 论文布局"
                    type: object
                    fields:
                      - name: titleGap
                        label: "Spacing below title (px) / 标题下方间距 (px)"
                        type: number
                      - name: entryPadding
                        label: "Publication entry vertical padding (px) / 每篇论文上下间距 (px)"
                        type: number
                      - name: numberSize
                        label: "Publication number size (px) / 论文序号字号 (px)"
                        type: number
                      - name: numberWidth
                        label: "Number column width (px) / 序号区域宽度 (px)"
                        type: number
                      - name: numberGap
                        label: "Number to title spacing (px) / 序号与标题间距 (px)"
                        type: number
                      - name: columns
                        label: "Publication columns / 论文列数"
                        type: number
              - name: honor
                label: "Honor / 荣誉"
                type: object
                fields:
                  - name: spacing
                    label: "Module spacing (optional) / 模块间距（留空继承通用）"
                    type: object
                    fields:
                      - name: top
                        label: "Top spacing (px) / 顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Bottom spacing (px) / 底部间距 (px)"
                        type: number
              - name: life
                label: "Life / 生活"
                type: object
                fields:
                  - name: spacing
                    label: "Module spacing (optional) / 模块间距（留空继承通用）"
                    type: object
                    fields:
                      - name: top
                        label: "Top spacing (px) / 顶部间距 (px)"
                        type: number
                      - name: bottom
                        label: "Bottom spacing (px) / 底部间距 (px)"
                        type: number
      - name: modules
        label: Page modules and submodules
        type: file
        path: data/modules.json
        format: json
        fields:
          - name: sections
            label: Add, remove, reorder, and rename modules
            type: block
            blockKey: type
            list:
              collapsible: {collapsed: true, summary: "{fields.header.titleEn} / {fields.header.titleZh}"}
            blocks:
              - name: text
                label: Text / About / Research interests
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - name: layout
                    label: Text layout
                    type: select
                    options: {values: [full, image-right]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - name: bodyEn
                    label: Content (English)
                    type: rich-text
                    options: {format: markdown, switcher: false, media: site_images, path: content}
                  - name: bodyZh
                    label: Content (Chinese)
                    type: rich-text
                    options: {format: markdown, switcher: false, media: site_images, path: content}
                  - name: image
                    label: Optional image
                    type: image
                    options: {media: site_images, path: modules, extensions: [jpg, jpeg, png, webp, gif, svg]}
                  - {name: imageAlt, label: Image description, type: string}
              - name: cards
                label: Cards / news / projects / honors / life
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - {component: sectionIntro, name: intro, label: Module introduction}
                  - name: items
                    label: Submodules or entries (add / remove / reorder)
                    type: object
                    list:
                      collapsible: {collapsed: true, summary: "{fields.titleEn} / {fields.titleZh}"}
                    fields:
                      - name: type
                        label: Submodule type
                        type: select
                        options:
                          values: [news, project, scholarship, honor, life, custom]
                      - {name: titleEn, label: Item name (English), type: string}
                      - {name: titleZh, label: Item name (Chinese), type: string}
                      - {name: date, label: Date, type: string}
                      - {name: subtitleEn, label: Short detail (English), type: string}
                      - {name: subtitleZh, label: Short detail (Chinese), type: string}
                      - name: bodyEn
                        label: Description (English)
                        type: rich-text
                        options: {format: markdown, switcher: false, media: site_images, path: content}
                      - name: bodyZh
                        label: Description (Chinese)
                        type: rich-text
                        options: {format: markdown, switcher: false, media: site_images, path: content}
                      - {name: url, label: Link URL, type: string}
                      - name: image
                        label: Image
                        type: image
                        options: {media: site_images, path: modules, extensions: [jpg, jpeg, png, webp, gif, svg]}
                      - {name: imageAlt, label: Image description, type: string}
              - name: publication
                label: Publications
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - {component: sectionIntro, name: intro, label: Module introduction}
                  - name: items
                    label: Publication entries (add / remove / reorder)
                    type: object
                    list: {collapsible: {collapsed: true, summary: "{fields.title}"}}
                    fields:
                      - {name: title, label: Publication title, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: titleZh, label: Publication title (Chinese), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: authors, label: Authors, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: venue, label: Journal or venue, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: venueZh, label: Journal or venue (Chinese), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: year, label: Year / issue, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: bodyEn, label: Details (English), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: bodyZh, label: Details (Chinese), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: url, label: DOI or publication URL, type: string}
              - name: education
                label: Education (school icon and description)
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - name: items
                    label: Schools (add / remove / reorder)
                    type: object
                    list: {collapsible: {collapsed: true, summary: "{fields.schoolEn} / {fields.schoolZh}"}}
                    fields:
                      - name: type
                        label: School type (high school / university)
                        type: select
                        options:
                          values: [high-school, university]
                      - {name: degreeEn, label: Degree (English), type: string}
                      - {name: degreeZh, label: Degree (Chinese), type: string}
                      - {name: schoolEn, label: School (English), type: string}
                      - {name: schoolZh, label: School (Chinese), type: string}
                      - {name: departmentEn, label: Department (English), type: string}
                      - {name: departmentZh, label: Department (Chinese), type: string}
                      - {name: departmentUrl, label: Department URL, type: string}
                      - {name: dates, label: Dates, type: string}
                      - {name: supervisorEn, label: Supervisor (English), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: supervisorZh, label: Supervisor (Chinese), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: bodyEn, label: Description (English), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: bodyZh, label: Description (Chinese), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: url, label: School website URL, type: string}
                      - {name: logoUrl, label: School logo image URL (editable), type: string}
                      - {name: logo, label: School icon or logo, type: image, options: {media: site_images, path: education, extensions: [jpg, jpeg, png, webp, svg]}}
              - name: links
                label: Personal homepages / social links
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - {component: sectionIntro, name: intro, label: Module introduction}
                  - name: items
                    label: Homepage links (add / remove / reorder)
                    type: object
                    list: {collapsible: {collapsed: true, summary: "{fields.labelEn} / {fields.labelZh}"}}
                    fields:
                      - {name: labelEn, label: Link name (English), type: string}
                      - {name: labelZh, label: Link name (Chinese), type: string}
                      - {name: url, label: Link URL, type: string}
                      - name: icon
                        label: Icon
                        type: select
                        options:
                          values: [scholar, orcid, linkedin, github, researchgate, x, website]
                      - {name: bodyEn, label: Description (English), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
