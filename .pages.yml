media:
  - name: site_images
    label: Website images
    input: assets
    output: /assets
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]
    rename: safe

components:
  moduleHeader:
    type: object
    fields:
      - {name: visible, label: Show this module, type: boolean}
      - {name: sectionLabelEn, label: Module label (English), type: string}
      - {name: sectionLabelZh, label: Module label (Chinese), type: string}
      - {name: titleEn, label: Module title (English), type: string}
      - {name: titleZh, label: Module title (Chinese), type: string}
  sectionIntro:
    type: object
    fields:
      - name: introEn
        label: Introduction (English)
        type: rich-text
        options: {format: markdown, switcher: false, media: site_images, path: content}
      - name: introZh
        label: Introduction (Chinese)
        type: rich-text
        options: {format: markdown, switcher: false, media: site_images, path: content}

content:
  - name: website
    label: Website editor
    type: group
    items:
      - name: profile
        label: Profile and homepage
        type: file
        path: data/site.json
        format: json
        fields:
          - {name: firstName, label: First name, type: string}
          - {name: lastName, label: Last name, type: string}
          - {name: pageTitle, label: Browser tab title, type: string}
          - {name: pageDescription, label: Search description, type: text}
          - name: avatar
            label: Portrait image
            type: image
            options: {media: site_images, path: profiles, extensions: [jpg, jpeg, png, webp]}
          - {name: avatarAlt, label: Portrait description, type: string}
          - {name: monogram, label: Initials shown without a portrait, type: string}
          - {name: email, label: Email address, type: string}
          - {name: phone, label: Phone number, type: string}
          - {name: heroKickerEn, label: Short profile label (English), type: string}
          - {name: heroKickerZh, label: Short profile label (Chinese), type: string}
          - {name: languageSwitchEn, label: Language switch text (English page), type: string}
          - {name: languageSwitchZh, label: Language switch text (Chinese page), type: string}
          - {name: showHeader, label: Show navigation bar, type: boolean}
          - {name: showHero, label: Show profile image and contacts, type: boolean}
          - {name: showFooter, label: Show footer, type: boolean}
          - name: footerTextEn
            label: Footer text (English)
            type: rich-text
            options: {format: markdown, switcher: false, media: site_images, path: content}
          - name: footerTextZh
            label: Footer text (Chinese)
            type: rich-text
            options: {format: markdown, switcher: false, media: site_images, path: content}
      - name: navigation
        label: Main page navigation (names and order)
        type: file
        path: data/navigation.json
        format: json
        fields:
          - name: items
            label: Main pages
            type: object
            list:
              collapsible: {collapsed: true, summary: "{fields.labelEn} / {fields.labelZh}"}
            fields:
              - name: key
                label: Page destination
                type: select
                options: {values: [profile, education, research, publication, honor, life]}
              - {name: labelEn, label: Navigation name (English), type: string}
              - {name: labelZh, label: Navigation name (Chinese), type: string}
      - name: appearance
        label: Appearance · 外观设置
        type: file
        path: data/style.json
        format: json
        fields:
          - name: typography
            label: "01 · 通用文字与标题"
            type: object
            fields:
              - name: bodyFont
                label: "正文字体"
                type: string
              - name: headingFont
                label: "标题字体"
                type: string
              - name: bodySize
                label: "正文基础字号 (px)"
                type: number
              - name: bodyLineHeight
                label: "正文行距（倍数）"
                type: number
              - name: headingSize
                label: "模块标题字号 (px)"
                type: number
              - name: headingWeight
                label: "模块标题字重"
                type: number
              - name: headingLineHeight
                label: "模块标题行距"
                type: number
              - name: paragraphGap
                label: "段落间距 (px)"
                type: number
              - name: alignment
                label: "正文对齐"
                type: select
                options: {values: ["left","center","right","justify"]}
              - name: linkDecoration
                label: "链接装饰"
                type: select
                options: {values: ["none","underline"]}
              - name: linkUnderlineOffset
                label: "链接下划线偏移 (px)"
                type: number
          - name: colors
            label: "02 · 全站颜色"
            type: object
            fields:
              - name: text
                label: "主文字（HEX，如 #26323d）"
                type: string
              - name: muted
                label: "次要文字（HEX，如 #26323d）"
                type: string
              - name: accent
                label: "强调色与链接（HEX，如 #26323d）"
                type: string
              - name: border
                label: "边框与分隔线（HEX，如 #26323d）"
                type: string
              - name: background
                label: "页面背景（HEX，如 #26323d）"
                type: string
              - name: soft
                label: "浅色背景（HEX，如 #26323d）"
                type: string
          - name: layout
            label: "03 · 页面布局与间距"
            type: object
            fields:
              - name: width
                label: "内容最大宽度 (px)"
                type: number
              - name: gutter
                label: "页面左右留白 (px)"
                type: number
              - name: sectionTop
                label: "模块顶部间距 (px)"
                type: number
              - name: sectionBottom
                label: "模块底部间距 (px)"
                type: number
              - name: columnGap
                label: "列间距 (px)"
                type: number
              - name: borderWidth
                label: "分隔线宽度 (px)"
                type: number
              - name: radius
                label: "通用圆角 (px)"
                type: number
              - name: headingGap
                label: "标题与内容间距 (px)"
                type: number
          - name: navigation
            label: "04 · 顶部导航与语言按钮"
            type: object
            fields:
              - name: fontSize
                label: "导航字号 (px)"
                type: number
              - name: height
                label: "导航栏最小高度 (px)"
                type: number
              - name: gap
                label: "导航项目间距 (px)"
                type: number
              - name: logoSize
                label: "左上角头像 Logo 尺寸 (px)"
                type: number
              - name: activeWeight
                label: "选中项目字重"
                type: number
              - name: buttonSize
                label: "语言按钮字号 (px)"
                type: number
              - name: buttonRadius
                label: "语言按钮圆角 (px)"
                type: number
          - name: profile
            label: "05 · 头像与邮箱联系方式"
            type: object
            fields:
              - name: avatarSize
                label: "头像尺寸 (px)"
                type: number
              - name: avatarRadius
                label: "头像圆角 (%)"
                type: number
              - name: imageFit
                label: "头像裁剪"
                type: select
                options: {values: ["cover","contain"]}
              - name: top
                label: "头像区域顶部间距 (px)"
                type: number
              - name: bottom
                label: "头像区域底部间距 (px)"
                type: number
              - name: contactSize
                label: "邮箱与电话字号 (px)"
                type: number
              - name: iconSize
                label: "联系方式图标尺寸 (px)"
                type: number
              - name: iconGap
                label: "图标与文字间距 (px)"
                type: number
              - name: contactTop
                label: "头像与联系方式间距 (px)"
                type: number
              - name: contactGap
                label: "多条联系方式间距 (px)"
                type: number
          - name: text
            label: "06 · About Me 与文字模块"
            type: object
            fields:
              - name: fontSize
                label: "文字模块正文字号 (px)"
                type: number
              - name: lineHeight
                label: "文字模块行距"
                type: number
              - name: imageSize
                label: "About Me 图片尺寸 (px)"
                type: number
              - name: imageRadius
                label: "About Me 图片圆角 (%)"
                type: number
              - name: imageGap
                label: "About Me 图片与文字间距 (px)"
                type: number
              - name: otherImageHeight
                label: "其他文字模块图片最大高度 (px)"
                type: number
              - name: lineLimit
                label: "文字行数上限（0 为全部显示）"
                type: number
          - name: education
            label: "07 · Education 学校模块"
            type: object
            fields:
              - name: fontSize
                label: "教育内容字号 (px)"
                type: number
              - name: lineHeight
                label: "内容行距"
                type: number
              - name: labelWeight
                label: "分类名称字重"
                type: number
              - name: logoSize
                label: "学校 Logo 区域尺寸 (px)"
                type: number
              - name: logoFit
                label: "Logo 图片适应方式"
                type: select
                options: {values: ["contain","cover"]}
              - name: logoRadius
                label: "Logo 圆角 (px)"
                type: number
              - name: columnGap
                label: "Logo 与文字间距 (px)"
                type: number
              - name: textWidth
                label: "文字区域最大宽度 (px)"
                type: number
              - name: fieldGap
                label: "每行内容间距 (px)"
                type: number
              - name: entryPadding
                label: "每所学校上下间距 (px)"
                type: number
              - name: bulletSize
                label: "分类圆点尺寸 (px)"
                type: number
              - name: bulletGap
                label: "圆点与内容间距 (px)"
                type: number
          - name: publications
            label: "08 · Publications 论文模块"
            type: object
            fields:
              - name: titleSize
                label: "论文标题字号 (px)"
                type: number
              - name: authorsSize
                label: "作者字号 (px)"
                type: number
              - name: venueSize
                label: "期刊与年份字号 (px)"
                type: number
              - name: detailsSize
                label: "补充描述字号 (px)"
                type: number
              - name: titleLineHeight
                label: "标题行距"
                type: number
              - name: bodyLineHeight
                label: "作者与期刊行距"
                type: number
              - name: titleGap
                label: "标题下方间距 (px)"
                type: number
              - name: entryPadding
                label: "每篇论文上下间距 (px)"
                type: number
              - name: numberSize
                label: "论文序号字号 (px)"
                type: number
              - name: numberWidth
                label: "序号区域宽度 (px)"
                type: number
              - name: numberGap
                label: "序号与标题间距 (px)"
                type: number
              - name: columns
                label: "论文列数"
                type: number
          - name: news
            label: "09 · Latest News 新闻模块"
            type: object
            fields:
              - name: font
                label: "新闻字体"
                type: string
              - name: dateSize
                label: "日期字号 (px)"
                type: number
              - name: titleSize
                label: "新闻标题字号 (px)"
                type: number
              - name: bodySize
                label: "新闻正文字号 (px)"
                type: number
              - name: lineHeight
                label: "新闻正文行距"
                type: number
              - name: entryGap
                label: "新闻条目间距 (px)"
                type: number
              - name: dateGap
                label: "日期与内容间距 (px)"
                type: number
              - name: bulletSize
                label: "日期前方块尺寸 (px)"
                type: number
              - name: imageWidth
                label: "图片最大宽度 (px)"
                type: number
              - name: imageHeight
                label: "图片最大高度 (px)"
                type: number
              - name: imageRadius
                label: "新闻图片圆角 (px)"
                type: number
          - name: cards
            label: "10 · Research / Honor / Life 卡片"
            type: object
            fields:
              - name: columns
                label: "卡片列数"
                type: number
              - name: titleSize
                label: "卡片标题字号 (px)"
                type: number
              - name: bodySize
                label: "卡片正文字号 (px)"
                type: number
              - name: subtitleSize
                label: "副标题字号 (px)"
                type: number
              - name: lineHeight
                label: "卡片正文行距"
                type: number
              - name: padding
                label: "卡片内边距 (px)"
                type: number
              - name: gap
                label: "卡片间距 (px)"
                type: number
              - name: radius
                label: "卡片圆角 (px)"
                type: number
              - name: imageHeight
                label: "卡片图片最大高度 (px)"
                type: number
          - name: links
            label: "11 · Personal Homepages 链接卡片"
            type: object
            fields:
              - name: columns
                label: "链接卡片列数"
                type: number
              - name: titleSize
                label: "主页名称字号 (px)"
                type: number
              - name: descriptionSize
                label: "主页描述字号 (px)"
                type: number
              - name: iconSize
                label: "图标区域尺寸 (px)"
                type: number
              - name: iconGlyphSize
                label: "图标本体尺寸 (px)"
                type: number
              - name: padding
                label: "链接卡片内边距 (px)"
                type: number
              - name: gap
                label: "链接卡片间距 (px)"
                type: number
              - name: radius
                label: "链接卡片圆角 (px)"
                type: number
          - name: footer
            label: "12 · 页脚"
            type: object
            fields:
              - name: fontSize
                label: "页脚字号 (px)"
                type: number
              - name: padding
                label: "页脚上下内边距 (px)"
                type: number
              - name: alignment
                label: "页脚文字对齐"
                type: select
                options: {values: ["left","center","right","justify"]}
          - name: mobile
            label: "13 · 手机端样式（560px 及以下）"
            type: object
            fields:
              - name: gutter
                label: "页面左右留白 (px)"
                type: number
              - name: headingSize
                label: "模块标题字号 (px)"
                type: number
              - name: navigationSize
                label: "导航字号 (px)"
                type: number
              - name: avatarSize
                label: "头像尺寸 (px)"
                type: number
              - name: aboutImageSize
                label: "About Me 图片尺寸 (px)"
                type: number
              - name: educationLogoSize
                label: "学校 Logo 尺寸 (px)"
                type: number
              - name: educationSize
                label: "教育内容字号 (px)"
                type: number
              - name: publicationTitleSize
                label: "论文标题字号 (px)"
                type: number
              - name: publicationBodySize
                label: "论文作者与期刊字号 (px)"
                type: number
              - name: cardColumns
                label: "卡片列数"
                type: number
              - name: linkColumns
                label: "主页链接列数"
                type: number
      - name: modules
        label: Page modules and submodules
        type: file
        path: data/modules.json
        format: json
        fields:
          - name: sections
            label: Add, remove, reorder, and rename modules
            type: block
            blockKey: type
            list:
              collapsible: {collapsed: true, summary: "{fields.header.titleEn} / {fields.header.titleZh}"}
            blocks:
              - name: text
                label: Text / About / Research interests
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - name: layout
                    label: Text layout
                    type: select
                    options: {values: [full, image-right]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - name: bodyEn
                    label: Content (English)
                    type: rich-text
                    options: {format: markdown, switcher: false, media: site_images, path: content}
                  - name: bodyZh
                    label: Content (Chinese)
                    type: rich-text
                    options: {format: markdown, switcher: false, media: site_images, path: content}
                  - name: image
                    label: Optional image
                    type: image
                    options: {media: site_images, path: modules, extensions: [jpg, jpeg, png, webp, gif, svg]}
                  - {name: imageAlt, label: Image description, type: string}
              - name: cards
                label: Cards / news / projects / honors / life
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - {component: sectionIntro, name: intro, label: Module introduction}
                  - name: items
                    label: Submodules or entries (add / remove / reorder)
                    type: object
                    list:
                      collapsible: {collapsed: true, summary: "{fields.titleEn} / {fields.titleZh}"}
                    fields:
                      - name: type
                        label: Submodule type
                        type: select
                        options:
                          values: [news, project, scholarship, honor, life, custom]
                      - {name: titleEn, label: Item name (English), type: string}
                      - {name: titleZh, label: Item name (Chinese), type: string}
                      - {name: date, label: Date, type: string}
                      - {name: subtitleEn, label: Short detail (English), type: string}
                      - {name: subtitleZh, label: Short detail (Chinese), type: string}
                      - name: bodyEn
                        label: Description (English)
                        type: rich-text
                        options: {format: markdown, switcher: false, media: site_images, path: content}
                      - name: bodyZh
                        label: Description (Chinese)
                        type: rich-text
                        options: {format: markdown, switcher: false, media: site_images, path: content}
                      - {name: url, label: Link URL, type: string}
                      - name: image
                        label: Image
                        type: image
                        options: {media: site_images, path: modules, extensions: [jpg, jpeg, png, webp, gif, svg]}
                      - {name: imageAlt, label: Image description, type: string}
              - name: publication
                label: Publications
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - {component: sectionIntro, name: intro, label: Module introduction}
                  - name: items
                    label: Publication entries (add / remove / reorder)
                    type: object
                    list: {collapsible: {collapsed: true, summary: "{fields.title}"}}
                    fields:
                      - {name: title, label: Publication title, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: titleZh, label: Publication title (Chinese), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: authors, label: Authors, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: venue, label: Journal or venue, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: venueZh, label: Journal or venue (Chinese), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: year, label: Year / issue, type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: bodyEn, label: Details (English), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: bodyZh, label: Details (Chinese), type: rich-text, options: {format: markdown, switcher: false}}
                      - {name: url, label: DOI or publication URL, type: string}
              - name: education
                label: Education (school icon and description)
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - name: items
                    label: Schools (add / remove / reorder)
                    type: object
                    list: {collapsible: {collapsed: true, summary: "{fields.schoolEn} / {fields.schoolZh}"}}
                    fields:
                      - name: type
                        label: School type (high school / university)
                        type: select
                        options:
                          values: [high-school, university]
                      - {name: degreeEn, label: Degree (English), type: string}
                      - {name: degreeZh, label: Degree (Chinese), type: string}
                      - {name: schoolEn, label: School (English), type: string}
                      - {name: schoolZh, label: School (Chinese), type: string}
                      - {name: departmentEn, label: Department (English), type: string}
                      - {name: departmentZh, label: Department (Chinese), type: string}
                      - {name: departmentUrl, label: Department URL, type: string}
                      - {name: dates, label: Dates, type: string}
                      - {name: supervisorEn, label: Supervisor (English), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: supervisorZh, label: Supervisor (Chinese), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: bodyEn, label: Description (English), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: bodyZh, label: Description (Chinese), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: url, label: School website URL, type: string}
                      - {name: logoUrl, label: School logo image URL (editable), type: string}
                      - {name: logo, label: School icon or logo, type: image, options: {media: site_images, path: education, extensions: [jpg, jpeg, png, webp, svg]}}
              - name: links
                label: Personal homepages / social links
                fields:
                  - name: page
                    label: Main page
                    type: select
                    options: {values: [profile, education, research, publication, honor, life]}
                  - {component: moduleHeader, name: header, label: Editable module name and title}
                  - {component: sectionIntro, name: intro, label: Module introduction}
                  - name: items
                    label: Homepage links (add / remove / reorder)
                    type: object
                    list: {collapsible: {collapsed: true, summary: "{fields.labelEn} / {fields.labelZh}"}}
                    fields:
                      - {name: labelEn, label: Link name (English), type: string}
                      - {name: labelZh, label: Link name (Chinese), type: string}
                      - {name: url, label: Link URL, type: string}
                      - name: icon
                        label: Icon
                        type: select
                        options:
                          values: [scholar, orcid, linkedin, github, website]
                      - {name: bodyEn, label: Description (English), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: bodyZh, label: Description (Chinese), type: rich-text, options: {format: markdown, switcher: false, media: site_images, path: content}}
                      - {name: image, label: Optional image, type: image, options: {media: site_images, path: links, extensions: [jpg, jpeg, png, webp, gif, svg]}}
                      - {name: imageAlt, label: Image description, type: string}
