<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Kexin Xiang's research profile and selected publication.">
  <title>Kexin Xiang — Personal Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="Back to top">
        <span class="mark" id="site-mark">K</span>
      </a>
      <nav id="module-nav" aria-label="Page modules"></nav>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">中文</button>
    </header>
    <main>
      <section class="hero" id="home">
        <aside class="profile-card" aria-label="Personal photo and contact">
          <div class="profile-monogram" id="profile-monogram" aria-hidden="true">
            <span id="profile-initials">KX</span>
            <img class="profile-photo" id="profile-photo" alt="" hidden>
          </div>
          <a class="profile-email" id="profile-email" href="mailto:" hidden></a>
        </aside>
        <div class="hero-copy">
          <p class="eyebrow"><span class="pulse"></span><span id="hero-kicker">PERSONAL WEBSITE</span></p>
          <h1><span id="first-name">Kexin</span><br><em id="last-name">Xiang</em></h1>
          <p class="hero-role" id="hero-role"></p>
        </div>
      </section>
      <div id="page-modules"></div>
    </main>
    <footer>
      <p id="footer-copy"></p>
      <a href="#home" class="back-top" id="back-top">BACK TO TOP ↑</a>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
